<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Quest for Bakutiiii</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; color: #fff;
        }
        h2 { margin: 5px 0 15px 0; color: #ffb6c1; text-align: center; }
        
        #game-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        
        canvas {
            background-color: #4caf50;
            border: 4px solid #2c3e50;
            border-radius: 8px;
            width: 100%; max-width: 360px; aspect-ratio: 1 / 1;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        #message-box {
            margin-top: 15px; padding: 12px; width: 100%; max-width: 360px;
            background-color: #16213e; border: 2px solid #ffb6c1; border-radius: 8px;
            min-height: 65px; font-size: 15px; font-weight: bold;
            color: #e94560; text-align: center;
        }

        /* D-Pad controls for iPhone */
        #d-pad {
            margin-top: 20px; display: grid;
            grid-template-columns: 65px 65px 65px;
            grid-template-rows: 65px 65px; gap: 10px; justify-content: center;
        }
        .btn {
            background: #0f3460; border: 2px solid #e94560; border-radius: 12px;
            font-size: 24px; display: flex; align-items: center; justify-content: center;
            user-select: none; cursor: pointer; color: white;
            box-shadow: 0 4px 0 #0a2240;
        }
        .btn:active {
            background: #e94560; box-shadow: 0 0 0 #0a2240; transform: translateY(4px);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        #win-screen {
            display: none; text-align: center; background-color: #16213e;
            padding: 20px; border-radius: 12px; border: 4px solid #ffb6c1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); max-width: 90%; margin-top: 20px;
        }
        #win-screen img {
            width: 250px; height: 250px; object-fit: cover;
            border-radius: 8px; border: 4px solid #e94560; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h2>Birthday Quest 💙</h2>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="message-box">Explore the darkness to find the treasure! Watch out for shadows.</div>
        
        <div id="d-pad">
            <div class="btn" id="btn-up">⬆️</div>
            <div class="btn" id="btn-left">⬅️</div>
            <div class="btn" id="btn-down">⬇️</div>
            <div class="btn" id="btn-right">➡️</div>
        </div>
    </div>

    <div id="win-screen">
        <h1 style="color: #ffb6c1; margin-top: 0;">Happy Birthday Bakutiiii! 💙🎉</h1>
        <p style="color: #ddd;">You are the real treasure!</p>
        <!-- The winning picture -->
        <img src="bakutiiii.jpg" alt="Bakutiiii">
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('message-box');
        
        // Setup custom audio (will fail silently if win.mp3 is not found, which is fine)
        const winSound = new Audio('win.mp3'); 

        const tileSize = 40;
        const cols = canvas.width / tileSize;
        const rows = canvas.height / tileSize;

        // --- GAME STATE ---
        let player = { x: 1, y: 1 };
        
        const hints = [
            { x: 3, y: 2, text: "Hint 1: The treasure blooms where friendship grows...", found: false },
            { x: 2, y: 7, text: "Hint 2: Seek out the dense flower garden in the bottom right!", found: false }
        ];

        const garden = { startX: 6, startY: 6, endX: 9, endY: 9 };
        const treasure = { x: 8, y: 8 };

        const enemies = [
            { x: 4, y: 1, min: 1, max: 5, dir: 1, axis: 'y' }, 
            { x: 1, y: 5, min: 1, max: 8, dir: 1, axis: 'x' }, 
            { x: 8, y: 4, min: 4, max: 8, dir: -1, axis: 'y' } 
        ];

        // Real-time loop for enemy movement
        let gameLoop = setInterval(updateEnemies, 600);

        // --- ENEMY LOGIC ---
        function updateEnemies() {
            enemies.forEach(enemy => {
                if (enemy.axis === 'x') {
                    enemy.x += enemy.dir;
                    if (enemy.x >= enemy.max || enemy.x <= enemy.min) enemy.dir *= -1;
                } else {
                    enemy.y += enemy.dir;
                    if (enemy.y >= enemy.max || enemy.y <= enemy.min) enemy.dir *= -1;
                }
            });
            checkCollisions();
            drawGame();
        }

        function checkCollisions() {
            enemies.forEach(enemy => {
                if (player.x === enemy.x && player.y === enemy.y) {
                    player.x = 1;
                    player.y = 1;
                    messageBox.innerText = "A shadow caught you! Back to the start!";
                }
            });
        }

        // --- RENDERING ---
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Checkerboard Grass
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    ctx.fillStyle = (i + j) % 2 === 0 ? "#4caf50" : "#45a049";
                    ctx.fillRect(i * tileSize, j * tileSize, tileSize, tileSize);
                }
            }

            // 2. Draw Garden Zone
            for (let i = garden.startX; i <= garden.endX; i++) {
                for (let j = garden.startY; j <= garden.endY; j++) {
                    ctx.fillStyle = "#388e3c"; 
                    ctx.fillRect(i * tileSize, j * tileSize, tileSize, tileSize);
                    
                    ctx.fillStyle = "#ffb6c1"; 
                    ctx.fillRect(i * tileSize + 10, j * tileSize + 10, 20, 20);
                    ctx.fillStyle = "#ffd700"; 
                    ctx.fillRect(i * tileSize + 15, j * tileSize + 15, 10, 10);
                }
            }

            // 3. Draw Hints
            hints.forEach(hint => {
                const hx = hint.x * tileSize;
                const hy = hint.y * tileSize;
                ctx.fillStyle = hint.found ? "rgba(255, 255, 255, 0.3)" : "#f1f2f6";
                ctx.fillRect(hx + 10, hy + 10, 20, 20);
                if (!hint.found) {
                    ctx.fillStyle = "#e84118"; 
                    ctx.fillRect(hx + 15, hy + 15, 10, 10);
                }
            });

            // 4. Draw Enemies
            enemies.forEach(enemy => {
                const ex = enemy.x * tileSize;
                const ey = enemy.y * tileSize;
                
                ctx.fillStyle = "#8e44ad"; 
                ctx.beginPath();
                ctx.arc(ex + 20, ey + 20, 15, Math.PI, 0); 
                ctx.lineTo(ex + 35, ey + 35);
                ctx.lineTo(ex + 5, ey + 35);
                ctx.fill();
                
                ctx.fillStyle = "#ff4757"; 
                ctx.fillRect(ex + 12, ey + 15, 4, 4);
                ctx.fillRect(ex + 24, ey + 15, 4, 4);
            });

            // 5. Draw Player
            const px = player.x * tileSize;
            const py = player.y * tileSize;
            ctx.fillStyle = "#3498db"; 
            ctx.fillRect(px + 10, py + 15, 20, 20);
            ctx.fillStyle = "#f1c40f"; 
            ctx.fillRect(px + 12, py + 3, 16, 14);
            ctx.fillStyle = "#2c3e50"; 
            ctx.fillRect(px + 15, py + 8, 3, 3);
            ctx.fillRect(px + 22, py + 8, 3, 3);

            // 6. FOG OF WAR
            ctx.globalCompositeOperation = 'source-over';
            const centerX = px + (tileSize / 2);
            const centerY = py + (tileSize / 2);
            const radius = tileSize * 2.5; 
            
            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.4, centerX, centerY, radius);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');      
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.98)');   

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.98)';
            ctx.fillRect(0, 0, canvas.width, centerY - radius); 
            ctx.fillRect(0, centerY + radius, canvas.width, canvas.height - (centerY + radius)); 
            ctx.fillRect(0, centerY - radius, centerX - radius, radius * 2); 
            ctx.fillRect(centerX + radius, centerY - radius, canvas.width - (centerX + radius), radius * 2); 
        }

        // --- PLAYER INTERACTION ---
        function checkInteractions() {
            let onHint = false;
            hints.forEach(hint => {
                if (player.x === hint.x && player.y === hint.y) {
                    messageBox.innerText = hint.text;
                    hint.found = true;
                    onHint = true;
                }
            });

            if (!onHint) {
                if (player.x >= garden.startX && player.y >= garden.startY) {
                    messageBox.innerText = "It smells like flowers here... keep looking!";
                } else {
                    messageBox.innerText = "Keep searching the dark...";
                }
            }

            if (player.x === treasure.x && player.y === treasure.y) {
                clearInterval(gameLoop); // Stop enemies
                winSound.play().catch(e => console.log("No audio file found, skipping sound."));
                document.getElementById('game-container').style.display = 'none';
                document.getElementById('win-screen').style.display = 'flex';
                document.getElementById('win-screen').style.flexDirection = 'column';
                document.getElementById('win-screen').style.alignItems = 'center';
            }
        }

        function movePlayer(dx, dy) {
            let newX = player.x + dx;
            let newY = player.y + dy;

            if (newX >= 0 && newX < cols && newY >= 0 && newY < rows) {
                player.x = newX;
                player.y = newY;
                checkInteractions();
                checkCollisions();
                drawGame();
            }
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
            if (e.key === "ArrowUp") movePlayer(0, -1);
            else if (e.key === "ArrowDown") movePlayer(0, 1);
            else if (e.key === "ArrowLeft") movePlayer(-1, 0);
            else if (e.key === "ArrowRight") movePlayer(1, 0);
        });

        // Touch Controls
        document.getElementById('btn-up').addEventListener('pointerdown', () => movePlayer(0, -1));
        document.getElementById('btn-down').addEventListener('pointerdown', () => movePlayer(0, 1));
        document.getElementById('btn-left').addEventListener('pointerdown', () => movePlayer(-1, 0));
        document.getElementById('btn-right').addEventListener('pointerdown', () => movePlayer(1, 0));

        // Start
        drawGame();
    </script>
</body>
</html>
